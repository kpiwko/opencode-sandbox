name: build

# Builds the OpenCode sandbox workload image for both architectures and publishes
# it to GHCR. Publishing has to happen here: GHCR requires `write:packages`, which
# a developer's `gh` login for ordinary repository work does not carry.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opencode-sandbox
  OPENCODE_VERSION: 2.4.1

jobs:
  build-and-push:
    name: build and push (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check image inputs
        run: python3 scripts/check-inputs.py

      - name: Set up QEMU (arm64 emulation on the amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch manifest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
            VERIFY_BINARY=0
          tags: |
            ${{ env.IMAGE }}:${{ env.OPENCODE_VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=OpenCode sandbox workload image for the OpenShell runtime

      - name: Record the digest to pin
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          {
            echo '### OpenCode sandbox image'
            echo
            echo '```'
            echo "${IMAGE}@${digest}"
            echo '```'
            echo
            echo 'Pin this digest in the consumer stage:'
            echo 'https://github.com/kpiwko/dotfiles/blob/main/.config/k8s/openshell/opencode/create-sandbox.sh'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image=${IMAGE}@${digest}"
