name: build

# Builds the OpenCode sandbox image on native runners per architecture with
# Podman/Buildah, then assembles one multi-arch manifest. No QEMU: OpenCode is a
# Bun binary and aborts under emulation, so a native build is also what lets the
# image verify its own `opencode --version` during the build.
#
# Publishing happens here because GHCR needs `write:packages`, which a developer's
# `gh` login for ordinary repository work does not carry.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opencode-sandbox
  OPENCODE_VERSION: 2.4.1

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify native Podman runner
        run: |
          set -euo pipefail
          command -v podman
          podman info >/dev/null
          case "$(uname -m):${{ matrix.arch }}" in
            x86_64:amd64|aarch64:arm64) ;;
            *) echo "Runner is not native for ${{ matrix.arch }}" >&2; exit 1 ;;
          esac

      - name: Check image inputs
        run: python3 scripts/check-inputs.py

      - name: Build image
        uses: redhat-actions/buildah-build@v3
        with:
          image: opencode-sandbox
          tags: ${{ github.sha }}-${{ matrix.arch }}
          context: .
          containerfiles: ./Containerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke-test the native image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image_ref="opencode-sandbox:${GITHUB_SHA}-${ARCH}"

          platform="$(podman image inspect --format '{{.Os}}/{{.Architecture}}' "${image_ref}")"
          test "${platform}" = "linux/${ARCH}"

          # The build already ran this during the build; the image must also work
          # with no build context around it.
          podman run --rm "${image_ref}" opencode --version | grep -F "v${OPENCODE_VERSION}"
          test "$(podman run --rm "${image_ref}" id -u)" = "998"
          test "$(podman run --rm "${image_ref}" id -un)" = "sandbox"
          podman run --rm "${image_ref}" \
            test -f /usr/local/share/opencode/plugins/opencode-plugin-otel/dist/index.js

      - name: Push per-architecture image to GHCR
        uses: redhat-actions/push-to-registry@v3
        with:
          image: opencode-sandbox
          tags: ${{ github.sha }}-${{ matrix.arch }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    name: publish multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Assemble and push the manifest
        run: |
          set -euo pipefail
          version_tag="${IMAGE}:${OPENCODE_VERSION}"
          sha_tag="${IMAGE}:sha-${GITHUB_SHA}"

          podman manifest create "${version_tag}"
          podman manifest add "${version_tag}" "docker://${IMAGE}:${GITHUB_SHA}-amd64"
          podman manifest add "${version_tag}" "docker://${IMAGE}:${GITHUB_SHA}-arm64"

          podman manifest push --all --digestfile /tmp/digest "${version_tag}" "docker://${version_tag}"
          podman manifest push --all "${version_tag}" "docker://${sha_tag}"

          digest="$(cat /tmp/digest)"
          {
            echo '### OpenCode sandbox image'
            echo
            echo '```'
            echo "${IMAGE}@${digest}"
            echo '```'
            echo
            echo 'Pin this digest in the consumer stage:'
            echo 'https://github.com/kpiwko/dotfiles/blob/main/.config/k8s/openshell/opencode/create-sandbox.sh'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image=${IMAGE}@${digest}"
